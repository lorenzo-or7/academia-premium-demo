<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VERTEX Performance Club — Your limits. Redefined.</title>
    <meta name="description" content="Protótipo demonstrativo Or7.dev de academia premium: modalidades, espaço, simulador de treino, planos, agenda e pré-agendamento por WhatsApp." />
    <meta name="theme-color" content="#0B0D0F" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="VERTEX Performance Club — protótipo demonstrativo" />
    <meta property="og:description" content="Website demonstrativo de academia premium desenvolvido por Or7.dev. Marca e dados fictícios." />
    <meta property="og:image" content="%BASE_URL%images/hero-1600.webp" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preload" href="%BASE_URL%fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="%BASE_URL%images/hero-960.webp"
      imagesrcset="%BASE_URL%images/hero-480.webp 480w, /images/hero-960.webp 960w, /images/hero-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <script>
      try {
        var t = localStorage.getItem('vertex-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Este protótipo demonstrativo precisa de JavaScript habilitado.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
